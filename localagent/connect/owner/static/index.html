<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Agent</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#16213e">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100dvh; display: flex; flex-direction: column; }
        #status { padding: 8px 16px; font-size: 12px; background: #16213e; color: #888; border-bottom: 1px solid #222; }
        #status.connected { color: #4caf50; }
        #status.error { color: #f44336; }
        #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 82%; padding: 10px 14px; border-radius: 18px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; font-size: 15px; }
        .msg.user { align-self: flex-end; background: #0f3460; border-bottom-right-radius: 4px; }
        .msg.agent { align-self: flex-start; background: #16213e; border: 1px solid #2a2a4a; border-bottom-left-radius: 4px; }
        .msg.agent.streaming { border-left: 3px solid #4caf50; }
        #form { display: flex; padding: 12px; gap: 8px; background: #16213e; border-top: 1px solid #222; }
        #input { flex: 1; padding: 12px 16px; border-radius: 24px; border: 1px solid #333; background: #0f1923; color: #e0e0e0; font-size: 16px; outline: none; }
        #input:focus { border-color: #4caf50; }
        #send { padding: 12px 20px; border-radius: 24px; border: none; background: #4caf50; color: #fff; font-size: 16px; cursor: pointer; font-weight: 600; }
        #send:disabled { background: #2a2a4a; color: #555; cursor: default; }
    </style>
</head>
<body>
    <div id="status">Connecting...</div>
    <div id="messages"></div>
    <form id="form">
        <input id="input" type="text" placeholder="Message..." autocomplete="off" disabled>
        <button id="send" type="submit" disabled>Send</button>
    </form>

    <script>
        const stored = sessionStorage.getItem("agent_token");
        const TOKEN = stored || (prompt("Enter access token:") || "");
        if (TOKEN) sessionStorage.setItem("agent_token", TOKEN);

        const proto = location.protocol === "https:" ? "wss" : "ws";
        const WS_URL = `${proto}://${location.host}/ws?token=${encodeURIComponent(TOKEN)}`;

        const statusEl = document.getElementById("status");
        const messagesEl = document.getElementById("messages");
        const inputEl = document.getElementById("input");
        const sendBtn = document.getElementById("send");

        let ws, currentAgentMsg = null;

        function connect() {
            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                statusEl.textContent = "Connected";
                statusEl.className = "connected";
                inputEl.disabled = false;
                sendBtn.disabled = false;
                inputEl.focus();
                setupPush();
            };

            ws.onclose = () => {
                statusEl.textContent = "Disconnected — refresh to reconnect";
                statusEl.className = "error";
                inputEl.disabled = true;
                sendBtn.disabled = true;
            };

            ws.onerror = () => {
                statusEl.textContent = "Connection error — check token or server";
                statusEl.className = "error";
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === "chunk") {
                    if (!currentAgentMsg) {
                        currentAgentMsg = appendMessage("", "agent streaming");
                    }
                    currentAgentMsg.textContent += data.text;
                    messagesEl.scrollTop = messagesEl.scrollHeight;
                } else if (data.type === "done") {
                    if (currentAgentMsg) {
                        currentAgentMsg.className = "msg agent";
                        currentAgentMsg = null;
                    }
                    sendBtn.disabled = false;
                    inputEl.disabled = false;
                    inputEl.focus();
                }
            };
        }

        function appendMessage(text, cls) {
            const el = document.createElement("div");
            el.className = `msg ${cls}`;
            el.textContent = text;
            messagesEl.appendChild(el);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return el;
        }

        document.getElementById("form").addEventListener("submit", (e) => {
            e.preventDefault();
            const text = inputEl.value.trim();
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
            appendMessage(text, "user");
            ws.send(text);
            inputEl.value = "";
            sendBtn.disabled = true;
            inputEl.disabled = true;
        });

        async function setupPush() {
            if (!("serviceWorker" in navigator) || !("PushManager" in window)) return;
            try {
                const reg = await navigator.serviceWorker.register("/static/sw.js");
                const perm = await Notification.requestPermission();
                if (perm !== "granted") return;

                const keyResp = await fetch("/api/push/vapid-public-key");
                const { key } = await keyResp.json();
                if (!key) return;

                const sub = await reg.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(key)
                });

                await fetch("/api/push/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${TOKEN}`
                    },
                    body: JSON.stringify(sub.toJSON())
                });
            } catch (e) {
                console.warn("Push setup failed:", e);
            }
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = "=".repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
            const rawData = atob(base64);
            return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
        }

        connect();
    </script>
</body>
</html>
