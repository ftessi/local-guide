# What your agent uses beyond the core. The code is NOT in this repo: it comes from `source`.
# After editing, run:  python -m localagent install      (see what exists: python -m localagent list)
# Remove a block to disable it. Settings under a name are passed to that tool/connection.

source: https://github.com/ftessi/local-guide-extensions.git   # or a local folder while you develop one
ref: main                                                       # branch or tag of the source

tools:
  calendar:
    compartment: private         # whose data the reminders are (see policy.yaml)

connections:
  phone:                         # web app for your phone/PC, with push notifications
    host: 127.0.0.1              # keep local; reach it from outside with the cloudflare connection
    port: 8000
  # cloudflare:                  # public HTTPS address for the phone app (needs cloudflared set up)
  #   tunnel: local-agent
