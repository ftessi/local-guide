# Your agent's settings. Secrets live in .env next to this file, never here.
# Tools and connections (calendar, phone app...) are chosen in installables.yaml.
name: my-agent

model:
  id: Qwen/Qwen2.5-3B-Instruct   # any HuggingFace chat/instruct model id
  backend: transformers          # transformers (NVIDIA) | llamacpp (any computer; docs/03-create-your-agent.md)
  quantization: 4bit             # transformers: 4bit | fp16 | none; llamacpp: q4_k_m, q8_0...
  max_new_tokens: 256            # longest reply, in tokens
  max_prompt_chars: 8000         # longest prompt, in characters; lower it if you get "Out of GPU memory"

# Data compartments. 'private' = only you. 'shared' is just an example extra one; nothing is shared automatically.
# To share with another agent, use a connection compartment (docs/08-connecting-agents.md).
# Add your own (lowercase, digits, '-'), e.g. family, work.
compartments: [private, shared]

memory:
  history_turns: 20              # how many past turns the model sees each message

